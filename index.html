<style id="splash-css">html.sp-on,html.sp-on body{background:#0b0f19}
/* ===== Splash screen ===== */
#splash-screen{position:fixed;inset:0;z-index:2147483000;background:#0b0f19;color:#E6ECF0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
 padding:env(safe-area-inset-top,0px) 24px calc(env(safe-area-inset-bottom,0px) + 40px);opacity:1;transition:opacity .7s ease,visibility .7s ease;visibility:visible}
#splash-screen.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash-screen .sp-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;animation:spIn .9s ease both}
#splash-screen img{width:min(56vw,260px);height:auto;display:block;background:none}
#splash-screen .sp-t{margin:0;font:600 34px/1.1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#F2C230}
#splash-screen .sp-l{display:flex;flex-direction:column;align-items:center;gap:12px;font:500 15px/1 "Barlow",system-ui,sans-serif;letter-spacing:.12em;color:#98A8B3}
#splash-screen .sp-bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
#splash-screen .sp-bar::after{content:"";position:absolute;top:0;left:0;height:100%;width:40%;border-radius:3px;background:#F2C230;animation:spBar 1.3s ease-in-out infinite}
#splash-screen .sp-d::after{content:"";animation:spDots 1.2s steps(1,end) infinite}
@keyframes spBar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes spDots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@keyframes spIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash-screen .sp-c{animation:none}#splash-screen .sp-bar::after{animation-duration:2.6s}#splash-screen{transition-duration:.01s}}
</style>

<style>
:root{--bg:#EDF0F3;--sf:#fff;--ink:#16232D;--mu:#566772;--ln:#CBD4DB;--st:#1D5C87;--on:#fff;--sig:#E5A800;--late:#A83232;
--fb:"Barlow","Segoe UI",system-ui,sans-serif;--fn:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11181E;--sf:#1A242C;--ink:#E6ECF0;--mu:#98A8B3;--ln:#2E3C46;--st:#6DB2E0;--on:#0B1620;--sig:#F2C230;--late:#EE9993}}
:root[data-theme="dark"]{--bg:#11181E;--sf:#1A242C;--ink:#E6ECF0;--mu:#98A8B3;--ln:#2E3C46;--st:#6DB2E0;--on:#0B1620;--sig:#F2C230;--late:#EE9993}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--fb)}
button,input,select{font:inherit;color:inherit}.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:var(--fn);margin:0}h1{font-size:32px}h2{font-size:24px}
.bc{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:6px 0 16px;font-size:15px;color:var(--mu)}
.bc button{background:none;border:0;padding:4px 0;color:var(--st);font-weight:600;cursor:pointer;text-decoration:underline}.bc b{color:var(--ink)}
.btn{border:0;border-radius:6px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;background:var(--st);color:var(--on)}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}.btn.d{background:transparent;color:var(--late);border:1px solid var(--late)}.btn.s{min-height:38px;padding:4px 12px;font-weight:500}
.list{display:grid;gap:10px;margin:14px 0}
.card{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--sig);border-radius:8px;padding:14px 16px;cursor:pointer}
.card:hover{border-color:var(--st)}.card .t{flex:1;min-width:0}.card .n{font-family:var(--fn);font-size:26px;font-weight:600;line-height:1.1}.card .sm{font-size:13px;color:var(--mu)}
.empty{color:var(--mu);padding:20px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border-top:2px solid var(--ink);margin:10px 0 18px}
.stats div{padding:10px 8px 10px 0}.stats b{display:block;font:700 30px/1.1 var(--fn)}.stats span{font-size:13px;color:var(--mu)}
.panel{background:#16232D;color:#E6ECF0;border-radius:10px;padding:14px}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:10px}.panel .ph span{color:#F2C230;font:600 20px var(--fn)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}.tin{min-width:480px}.row{display:grid;grid-template-columns:44px repeat(4,minmax(58px,1fr)) 84px;gap:5px;margin-bottom:5px;align-items:stretch}
.hd{line-height:1.1;align-items:end;font-size:12px;color:#98A8B3;text-align:center}
.dl{display:flex;flex-direction:column;justify-content:center;font-size:12px;color:#98A8B3;line-height:1.1}.dl b{font:600 20px var(--fn);color:#E6ECF0}
.cell{min-height:58px;border:1px solid #2E3C46;border-radius:6px;background:#1E2E39;color:#E6ECF0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:2px}
.cell:hover{border-color:#6DB2E0}.cell b{font:700 22px var(--fn)}.cell small{font-size:11px;color:#98A8B3}.cell.on{border-color:#6DB2E0;background:#1F3444}.cell i{font-style:normal;color:#556673;font-size:20px}
.dt{display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 19px/1.1 var(--fn);color:#E6ECF0;text-align:center}.dt small{font:400 11px var(--fb);color:#98A8B3}.dt.sal{color:#5CC49A}.dt.neg{color:#EE9993}.cell.out.on{border-color:#F2C230;background:#3A3213}
.card2{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-top:18px}
.grp{border-top:1px solid var(--ln);padding:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:end}
.grp .gn{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font:600 21px var(--fn)}
.gt{text-align:right}.gt b{display:block;font:700 26px/1.1 var(--fn)}.gt span,label{font-size:13px;color:var(--mu)}
.grand{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px 14px;background:var(--st);color:var(--on);border-radius:8px;font-weight:600}.grand b{font:700 30px var(--fn)}
input,select,textarea{font:inherit;color:inherit;width:100%;font-size:16px;padding:10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--st);outline-offset:2px}
dialog{border:0;border-radius:10px;padding:0;width:calc(100% - 32px);max-width:480px;background:var(--sf);color:var(--ink);max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(8,16,22,.6)}.dlg{padding:20px}.dlg h3{font-size:26px;margin-bottom:10px}
.pi,.ph2{display:grid;grid-template-columns:minmax(0,1fr) 84px 40px;gap:6px;margin-bottom:10px}.pi input,.pi select{padding:8px}.ph2{color:var(--mu);font-size:13px;margin-bottom:4px}.pi .x{min-height:0;padding:0}.pinfo{grid-column:1/-1;font-size:13px;color:var(--mu);margin-top:-2px}
.tot{background:var(--bg);border-radius:6px;padding:8px 10px;font-weight:600;margin:8px 0}
.err{min-height:20px;color:var(--late);font-weight:500;margin:6px 0}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tbl2{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;min-width:640px;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:right;vertical-align:middle}th:first-child,td:first-child{text-align:left}th{font-size:12px;font-weight:500;color:var(--mu)}
td b{font:700 20px var(--fn)}td small{display:block;font-size:12px;color:var(--mu)}td.neg,td.neg b{color:var(--late)}tfoot td{background:var(--bg);border-top:2px solid var(--ink);font-weight:600}
.cdadd{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:8px 0 4px}.cdadd label{flex:1;min-width:150px}
.dg{border-top:1px solid var(--ln);padding:12px 0;margin-top:10px}.cdh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.cdt b{display:block;font:700 26px/1.1 var(--fn)}.cdt span{font-size:13px;color:var(--mu)}.cdh label{min-width:150px}
.cd{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;margin-bottom:8px;display:grid;gap:8px}.cd input,.cd select{background:var(--sf)}.cd label{display:block}
.cdr1{display:flex;justify-content:space-between;align-items:center;font:600 19px var(--fn)}.cdr1 .x{min-height:0;height:36px;width:40px;padding:0}
.cdg3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:end}.cdg3 .gt b{font-size:20px}
.it{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:8px;display:grid;gap:8px}.cd .it input,.cd .it select{background:var(--bg)}
.itr{display:flex;gap:6px;align-items:center}.itr select{flex:1;min-width:0}.itr .x{min-height:0;height:40px;width:40px;padding:0;flex:none}
.cdtot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ln);padding-top:8px;font-weight:600}.cdtot b{font:700 22px var(--fn)}
.cr{display:grid;grid-template-columns:minmax(0,1fr) 96px 40px;gap:6px;align-items:center;margin-bottom:6px}.cr .x{min-height:0;height:38px;padding:0}.crh{color:var(--mu);font-size:13px;margin-bottom:4px}.cr.add{grid-template-columns:minmax(0,1fr) 96px auto;margin-top:10px}.cr.add .btn{min-height:44px}#caterr{min-height:0;margin:4px 0 0}#caterr:empty{display:none}.cath{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}#catbox{border-left:6px solid var(--st)}.chips{display:flex;flex-wrap:wrap;gap:8px}

.wrap>h1,#app>h2{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.65)}
.bc{color:#E4F3F5;text-shadow:0 1px 6px rgba(0,0,0,.7)}.bc button{color:#9FE0F5}.bc b{color:#fff}
.list>.empty{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.stats{border-top:2px solid var(--gold)}.stats b{text-shadow:0 2px 6px rgba(0,0,0,.6)}.stats span{color:#E4F3F5;text-shadow:0 1px 5px rgba(0,0,0,.7)}
.stats div:nth-child(1) b{color:#FFD54A}.stats div:nth-child(2) b{color:#7FD3F0}.stats div:nth-child(3) b{color:#9BE36B}
.btn{background:linear-gradient(135deg,#0F7C7C,#2E9A6B);color:#fff}
.card,.card2{background:var(--gl);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.list .card:nth-child(3n+1){border-left-color:var(--cane)}.list .card:nth-child(3n+2){border-left-color:var(--pan)}.list .card:nth-child(3n){border-left-color:var(--teal)}
#catbox{border-left:6px solid var(--cane)}
.panel{background:rgba(6,44,48,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12)}
.cell{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18)}
.cell.on{background:rgba(111,168,46,.34);border-color:#8FCB4B}
.cell.out.on{background:rgba(242,194,48,.28);border-color:var(--gold)}
.hd>*:nth-child(2){color:#8FB8FF}.hd>*:nth-child(3){color:#FFD54A}.hd>*:nth-child(4){color:#FFA96B}.hd>*:nth-child(5){color:#B69CFF}
table thead th{color:#fff;font-weight:600;font-size:12.5px;padding:10px 6px;background:var(--teal);border-bottom:0}
table thead th:nth-child(1){background:#0B5F63}table thead th:nth-child(2){background:#B9770E}table thead th:nth-child(3){background:#1D5C87}
table thead th:nth-child(4){background:#3F7F1E}table thead th:nth-child(5){background:#0F7C7C}table thead th:nth-child(6){background:#C9782B}
tbody tr:nth-child(odd) td{background:rgba(94,154,37,.13)}tbody tr:nth-child(even) td{background:rgba(201,120,43,.13)}
tbody td:first-child{font-weight:600;border-left:4px solid var(--cane)}tbody tr:nth-child(even) td:first-child{border-left-color:var(--pan)}
td{border-bottom:1px solid rgba(127,127,127,.25)}
tfoot td{background:linear-gradient(135deg,#B9640F,#C9782B);color:#fff;border-top:0}tfoot td small{color:#FFF1DC}
.cd{background:rgba(201,120,43,.10);border-left:4px solid var(--pan)}
.grand{background:linear-gradient(90deg,#0F7C7C,#5E9A25);color:#fff}
dialog{background:var(--sf)}

/* ===== Ajuste de ancho: nada debe salirse de la pantalla ===== */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.wrap{width:100%;max-width:760px;overflow-x:hidden}
input,select,button{min-width:0;max-width:100%}
.grp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cdg3{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)}
.cd,.it,.cdh,.cdadd,.dg,.card,.card2,.panel{min-width:0;max-width:100%}
.cdh label,.cdadd label{min-width:0;flex:1 1 140px}
.cdadd .btn{flex:0 0 auto}
.stats div:nth-child(4) b{color:#FFA96B}
.unitrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 14px}.unitrow label{display:block;min-width:0}.unitrow input,.unitrow select{margin-top:4px}

/* ===== Registro operativo / pantalla principal ===== */
.tabs{display:flex;gap:6px;margin:0 0 16px;padding:4px;background:var(--gl);border-radius:10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tab{flex:1;min-width:0;min-height:44px;border:0;border-radius:7px;background:transparent;color:var(--ink);font-weight:600;cursor:pointer;padding:8px 10px}
.tab[aria-selected="true"]{background:linear-gradient(135deg,#0F7C7C,#2E9A6B);color:#fff}
.intro{color:#E4F3F5;text-shadow:0 1px 6px rgba(0,0,0,.7);margin:0 0 12px;font-size:15px}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.jump .btn{background:var(--gl);color:var(--ink);border:1px solid var(--ln)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.fgrid label{display:block;min-width:0}.fgrid input,.fgrid select{margin-top:4px}
#gp{border-left:6px solid var(--cane)}#secTurnos{border-left:6px solid var(--teal)}#secCargues{border-left:6px solid var(--pan)}
.ro-list{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.ro-item{display:flex;align-items:baseline;gap:8px;padding:8px 12px;border:1px solid var(--ln);border-left:5px solid var(--cane);border-radius:6px;background:var(--bg)}
.ro-item span{font:600 21px var(--fn)}.ro-item b{font:500 14px var(--fb);color:var(--mu)}
.roi{display:flex;justify-content:space-between;gap:8px;font-size:15px}.roi span:last-child{color:var(--mu);text-align:right}
.hfil{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.hfil label{flex:1 1 150px;min-width:0;display:block}.hfil select,.hfil input{margin-top:4px}
table.ht{min-width:780px}
table.ht thead th:nth-child(n){background:var(--teal);color:#fff}
td.l,th.l{text-align:left}td.ac{white-space:nowrap}td.ac .btn{margin-left:4px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}.tag.t{background:#3F7F1E}.tag.c{background:#B9640F}
.prt{display:flex;flex-direction:column;padding:6px 0;border-top:1px solid var(--ln)}.prt span{font-size:13px;color:var(--mu)}
.lq{white-space:pre-wrap;background:var(--bg);border-radius:6px;padding:10px;font:14px/1.4 var(--fb);margin:0 0 12px}
.shr3{display:flex;gap:8px;flex-wrap:wrap}.shr3 .btn{text-decoration:none;display:inline-flex;align-items:center}
.btn.shr{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* ===== Referencias múltiples, encadenamiento e icono ===== */
.qh{margin:14px 0 6px;font-weight:600;font-size:15px}
.ql{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.qr{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--ln);border-left:5px solid var(--cane);border-radius:6px;background:var(--bg)}
.qr label{display:flex;flex-direction:column;min-width:0;font-size:inherit;color:var(--ink)}
.qr label span{font:600 20px/1.1 var(--fn);overflow-wrap:anywhere}.qr label small{font-size:12px;color:var(--mu)}
.qr input{text-align:right;padding:8px}
.qr .bod{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:8px;border-top:1px dashed var(--ln)}
.qr .bod label{gap:4px}.qr .bod label span{font:600 14px/1.1 var(--fb);color:var(--mu)}
.qr .bod input[readonly]{background:transparent;border-style:dashed;color:var(--mu);cursor:default}
.chain{margin:6px 0 10px;padding:8px 10px;border-radius:6px;background:var(--bg);border-left:5px solid var(--teal);font-size:14px}
.lnk{background:none;border:0;padding:4px 0;margin-left:4px;color:var(--st);font-weight:600;text-decoration:underline;cursor:pointer;min-height:32px}
input[readonly]{opacity:.8;background:var(--sf);border-style:dashed}
.btn.ico{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tp{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:4px;margin-top:4px}.tp select{margin-top:0;padding:10px 2px}.tp select:disabled{opacity:.8;background:var(--sf);border-style:dashed}
.pj{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}.pj>div{background:var(--bg);border-left:5px solid var(--teal);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.pj small{font-size:13px;color:var(--mu)}.pj b{font:600 26px/1.1 var(--fn)}.pj em{font-style:normal;font-size:13px;color:var(--mu)}
.hr{display:flex;justify-content:space-between;gap:14px;white-space:nowrap}.hr b{font:600 17px var(--fn)}
td.l{min-width:120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.top h1{margin:0}
.cst{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px;font:500 13px/1.2 var(--fb);cursor:pointer;max-width:100%;text-align:left}
.tst{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.cst.net{cursor:default}.cst.off i{background:var(--mu)}
.cst i{width:10px;height:10px;border-radius:50%;background:var(--mu);flex:none}.cst.ok i{background:#2E9A6B}.cst.wait i{background:var(--sig)}.cst.new i{background:var(--st)}.cst.bad i{background:var(--late)}
.btn svg{vertical-align:-4px;margin-right:4px}

/* ===== Inicio de sesión / barra de usuario ===== */
body.locked .wrap{display:none}
#login{display:none;position:fixed;inset:0;z-index:50;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(4,24,30,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.locked #login{display:block}
.lgc{max-width:420px;margin:5vh auto 0;background:var(--gl);border:1px solid var(--ln);border-left:6px solid var(--cane);border-radius:12px;padding:22px}
.lgc h1{font-size:30px;margin-bottom:2px}.lgc .tabs{margin:14px 0 16px;background:var(--bg)}.lgc .tab{font-size:14px;padding:6px 4px}
.lgc label{display:block;margin-bottom:4px}.lgc .btn{width:100%}.lgc .hint{font-size:13px;color:var(--mu);margin:8px 0 0}
.ub{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0 12px;padding:8px 12px;background:var(--gl);border:1px solid var(--ln);border-radius:10px;font-size:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ub[hidden]{display:none}
#app input:disabled,#app select:disabled{opacity:.9;cursor:default}


/* ===== Totales por referencia + resumen compartible ===== */
.ro-item{flex:1 1 100%;flex-wrap:wrap;align-items:center}
.ro-item .ro-tot{margin-left:auto;text-align:right;font:600 19px/1.1 var(--fn);color:var(--ink);white-space:nowrap}
.ro-item .ro-tot small{display:block;font:400 11px var(--fb);color:var(--mu);letter-spacing:.04em}
.sumh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px;padding:8px 10px 8px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:10px}
.sumh .sumt{min-width:0;font-size:14px;color:var(--mu)}.sumh .sumt b{color:var(--ink)}

(function(){

function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fc(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function f(n,d){return Number(n).toLocaleString('en-US',{maximumFractionDigits:d||0})}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ad(s,n){var d=pd(s);d.setDate(d.getDate()+n);return d}

function wend(w){return w.end||iso(ad(w.start,6))}
function ddiff(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function wdays(w){return ddiff(w.start,wend(w))+1}
